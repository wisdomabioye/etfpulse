<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Match body bg to suppress the white-flash on initial paint.
         Outer page is --color-bg-0 (desktop surface behind the frame). -->
    <meta name="theme-color" content="#050506" />
    <meta
      name="description"
      content="Bound the loss. Let the rest compound. Crypto ETF flow signals with published outcomes — AI-explained, delivered to Telegram."
    />

    <!-- Open Graph (Facebook, LinkedIn, Telegram link previews, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ETFPulse — Bound the loss. Let the rest compound." />
    <meta
      property="og:description"
      content="Crypto ETF flow signals with published outcomes. Every entry, stop, and target — measured 72h later, in public."
    />
    <meta property="og:site_name" content="ETFPulse" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ETFPulse — Bound the loss. Let the rest compound." />
    <meta
      name="twitter:description"
      content="Crypto ETF flow signals with published outcomes. Every entry, stop, and target — measured 72h later, in public."
    />

    <!-- Inter (display + body) + JetBrains Mono (numeric/monospace).
         Preconnect first so the TLS handshake is warm by the time the CSS
         fetches the font URLs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <title>ETFPulse — Bound the loss. Let the rest compound.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
