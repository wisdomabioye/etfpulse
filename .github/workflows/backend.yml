name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etfpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Both URLs point at the same DB on CI — only one Postgres is provisioned.
      # `DATABASE_URL` is what `etfpulse.db.engine` binds to at import time;
      # `DATABASE_URL_TEST` is what the conftest swaps to during the test session.
      # Pointing both at the test DB avoids any test code path needing a separate
      # dev DB that doesn't exist on the runner.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/etfpulse_test
      DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/etfpulse_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `--extra dev` includes our `[project.optional-dependencies].dev` group.
      # `--dev` would only match `[dependency-groups].dev` which we don't use.
      - name: Install deps
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy etfpulse/

      # Issue #22 — every migration must declare a non-trivial downgrade().
      # Static check (no DB needed); fast guardrail before the round-trip.
      - name: Migration rollback (static)
        run: uv run poe migrate-check

      # Issue #22 — verify the most recent migration's downgrade SQL is
      # valid against a real Postgres. Runs before tests so a broken
      # downgrade fails CI fast and clearly.
      - name: Migration rollback (round-trip)
        run: uv run poe migrate-roundtrip

      - name: Test + coverage
        run: uv run poe cov
