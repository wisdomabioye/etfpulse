[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etfpulse"]

[project]
name = "etfpulse"
version = "0.1.0"
description = "ETF flow signal intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-telegram-bot>=21.9",
    "apscheduler>=3.10.0",
    "structlog>=24.4.0",
    "cachetools>=5.5.0",
    # Stage 09 — EIP-712 signing + EVM utilities for SoDEX order submission.
    # `eth-account` ships the signer; `web3` pulls in `eth-utils` + keccak +
    # rlp which the SoDEX adapter uses for typed-data hashing. ~30 MB image
    # footprint accepted (Stage 09 is the only consumer).
    "eth-account>=0.13.0",
    "web3>=7.0.0",
    # PR D.4 — JWT mint/verify for the execution surface. `crypto` extra
    # pulls `cryptography` for HS256 fast-path (constant-time HMAC). Used
    # by `api/auth.py` to issue session tokens after SIWE (web) or
    # Telegram WebApp HMAC (PR D.5) bindings succeed.
    "pyjwt[crypto]>=2.9.0",
    # PR D.4 — EIP-4361 Sign-In-With-Ethereum message parser + verifier.
    # Re-uses the already-present `eth-account` for signature recovery.
    # Anti-drift rule 27 is path-scoped to `adapters/sodex/` — the
    # `siwe` lib (and its `eth_account` recovery primitive) is allowed
    # outside that path; it does NOT sign anything, only recovers the
    # signer address from a presented signature.
    "siwe>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "poethepoet>=0.32.0",
    "types-cachetools>=5.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogen produces long string literals (CHECK SQL, op.drop_index with
# postgresql_where) that ruff format can't safely split. Ignore line-length in
# generated migrations only — keep all other lints (imports, naming, etc.).
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

# APScheduler ships no py.typed marker — silence the import-untyped error
# without sprinkling per-line ignores across the scheduler module.
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

# `siwe` lib has no py.typed marker. Used only by `api/auth_siwe.py`.
[[tool.mypy.overrides]]
module = "siwe.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

# Coverage config — used by `poe cov` and CI. NOT enabled in pytest addopts:
# running a single test (e.g. `pytest tests/test_x.py::test_y`) shouldn't
# enforce a global coverage threshold against the whole codebase.
[tool.coverage.run]
source = ["etfpulse"]
branch = true
# SQLAlchemy bridges async <-> sync via greenlet (`greenlet_spawn`). Without
# the `greenlet` concurrency tracker, coverage.py silently misses every line
# that runs after `await session.execute(...)` — observed empirically:
# routes/track_record.py reports 47% even though tests prove the body runs
# end-to-end. Adding "greenlet" + "thread" picks up the missed branches.
concurrency = ["greenlet", "thread"]
# Migration files are autogenerated DDL — coverage there is meaningless.
omit = ["etfpulse/migrations/*", "tests/*"]

[tool.coverage.report]
# Branch+line baseline measured at 92.60% on 2026-05-10 (after fixing the
# greenlet concurrency config — see [tool.coverage.run] above). Threshold
# sits ~2.5 points below so refactors with one extra unreachable branch
# don't trip CI. Ratchet up over time as remaining gaps get covered
# (notably prices.py:get_daily_klines_from_source, db.py:get_session,
# and the AI-failure branches in signal_builder.py) — bumping this is a
# deliberate act.
fail_under = 90
show_missing = true
skip_covered = false
# Standard exclusions: defensive branches that pytest can't reach without
# faking unreachable failures (TYPE_CHECKING, abstract methods, etc.).
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Task shortcuts — run with `uv run poe <task>` (see `uv run poe` for list).
# Extra CLI args pass through: e.g. `uv run poe test -v tests/test_foo.py`.
# ---------------------------------------------------------------------------
[tool.poe.tasks.dev]
cmd = "uvicorn etfpulse.app:app --host 0.0.0.0 --port 8000 --reload"
help = "Run FastAPI dev server with hot reload"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Lint with ruff"

[tool.poe.tasks.format]
cmd = "ruff format --check ."
help = "Check formatting (CI mode — read-only)"

[tool.poe.tasks.format-fix]
cmd = "ruff format ."
help = "Apply ruff formatting"

[tool.poe.tasks.typecheck]
cmd = "mypy etfpulse/"
help = "Run mypy"

[tool.poe.tasks.test]
cmd = "pytest"
help = "Run pytest (no coverage — fast iteration)"

[tool.poe.tasks.cov]
# `--cov-fail-under` redundant with `[tool.coverage.report].fail_under` but
# keeps the threshold visible at the invocation site too.
cmd = "pytest --cov=etfpulse --cov-report=term-missing --cov-fail-under=90"
help = "Run pytest with coverage report + 90% fail-under threshold"

[tool.poe.tasks.migrate]
cmd = "alembic upgrade head"
help = "Apply pending Alembic migrations"

[tool.poe.tasks.revision]
shell = """alembic revision --autogenerate -m "$message" \
    && ruff format --quiet migrations/ \
    && ruff check --fix --quiet migrations/"""
help = "Autogenerate + format + auto-fix a migration (usage: uv run poe revision 'message')"
args = [{ name = "message", positional = true, required = true }]

[tool.poe.tasks.migrate-check]
cmd = "python scripts/check_migration_rollback.py"
help = "Issue #22 — static check: every migration must declare a non-trivial downgrade()"

[tool.poe.tasks.migrate-roundtrip]
cmd = "bash scripts/check_migration_roundtrip.sh"
help = "Issue #22 — DB round-trip: upgrade → downgrade -1 → upgrade head against test DB"

[tool.poe.tasks.check]
help = "Run the full CI check suite — lint, format, typecheck, migrate-check, test+coverage"
sequence = ["lint", "format", "typecheck", "migrate-check", "cov"]
default_item_type = "ref"
