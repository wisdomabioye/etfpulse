services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etfpulse
      POSTGRES_USER: etfpulse
      POSTGRES_PASSWORD: etfpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://etfpulse:etfpulse@postgres:5432/etfpulse
    command: uv run uvicorn etfpulse.app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
